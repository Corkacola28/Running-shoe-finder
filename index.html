<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Running Shoe Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏃 Running Shoe Finder</h1>
            <p>Find the perfect running shoe based on your goals, fit, and training style</p>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label for="goal">Training Goal:</label>
                <select id="goal">
                    <option value="">All Goals</option>
                    <option value="daily">Daily Training</option>
                    <option value="speed">Speed Work</option>
                    <option value="longrun">Long Distance</option>
                    <option value="recovery">Recovery</option>
                    <option value="race">Racing</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="width">Foot Width:</label>
                <select id="width">
                    <option value="">All Widths</option>
                    <option value="narrow">Narrow</option>
                    <option value="medium">Medium</option>
                    <option value="wide">Wide</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="focus">Training Focus:</label>
                <select id="focus">
                    <option value="">All Focus</option>
                    <option value="cushion">Maximum Cushion</option>
                    <option value="speed">Speed & Responsiveness</option>
                    <option value="stability">Stability</option>
                    <option value="value">Best Value</option>
                </select>
            </div>

            <button id="reset">Reset Filters</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
